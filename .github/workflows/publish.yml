name: Build & Release

on:
  push:
    branches:
      - publish

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-2025, windows-11-arm, macos-26, macos-26-intel]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Project Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Linux Packaging tools
        if: ${{matrix.os == 'ubuntu-24.04' || matrix.os == 'ubuntu-24.04-arm'}}
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            fakeroot \
            rpm \
            libarchive-tools \
            desktop-file-utils \
            libc6-dev \
            squashfs-tools \
            xz-utils \
            zsync \
            flatpak \
            flatpak-builder \
            libfuse2 \
            icnsutils \
            graphicsmagick \
            imagemagick

      - name: Build Electron (Linux x64)
        if: matrix.os == 'ubuntu-24.04'
        run: pnpm run electron:dist-linux

      - name: Build Electron (Linux ARM)
        if: matrix.os == 'ubuntu-24.04-arm'
        run: pnpm run electron:dist-linux-arm

      - name: Build Electron (Windows)
        if: matrix.os == 'windows-2025'
        run: pnpm run electron:dist-windows

      - name: Build Electron (Windows ARM)
        if: matrix.os == 'windows-11-arm'
        run: pnpm run electron:dist-windows-arm

      - name: Build Electron (MacOS ARM)
        if: matrix.os == 'macos-26'
        run: pnpm run electron:dist-mac

      - name: Build Electron (MacOS Intel)
        if: matrix.os == 'macos-26-intel'
        run: pnpm run electron:dist-mac-intel

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: dist/

  android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Build Android
        run: pnpm run android:build

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: "*.apk"

  release:
    needs: [build, android]
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            **/*.tar.*
            **/*.rpm
            **/*.deb
            **/*.AppImage
            **/*.flatpak
            **/*Setup*.exe
            **/*.dmg
            **/*.zip
            **/*.apk

          tag_name: latest
          name: Latest Build
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}