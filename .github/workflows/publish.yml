name: Build & Release

on:
  push:
    branches:
      - publish

permissions:
  contents: write

jobs:
  build-linux-x64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Linux Packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential fakeroot rpm libarchive-tools desktop-file-utils \
            libc6-dev squashfs-tools xz-utils zsync \
            libfuse2 icnsutils graphicsmagick imagemagick

      - run: pnpm run electron:dist-linux

      - uses: actions/upload-artifact@v4
        with:
          name: build-linux-x64
          path: dist/

  build-linux-arm:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Install Linux Packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential fakeroot rpm libarchive-tools desktop-file-utils \
            libc6-dev squashfs-tools xz-utils zsync \
            libfuse2 icnsutils graphicsmagick imagemagick

      - run: pnpm run electron:dist-linux-arm

      - uses: actions/upload-artifact@v4
        with:
          name: build-linux-arm
          path: dist/

  build-windows-x64:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run electron:dist-windows

      - uses: actions/upload-artifact@v4
        with:
          name: build-windows-x64
          path: dist/

  build-windows-arm:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - run: pnpm run electron:dist-windows-arm

      - uses: actions/upload-artifact@v4
        with:
          name: build-windows-arm
          path: dist/

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - run: pnpm run android:build

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: "*.apk"

  release:
    needs:
      - build-linux-x64
      - build-linux-arm
      - build-windows-x64
      - build-windows-arm
      - android

    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          prerelease: false
          files: |
            **/*.tar.*
            **/*.deb
            **/*.AppImage
            **/*.flatpak
            **/*Setup*.exe
            **/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}